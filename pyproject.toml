[project]
name = "mlx-stack"
dynamic = ["version"]
description = "CLI control plane for local LLM infrastructure on Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "mlx-stack contributors" },
]
keywords = ["mlx", "llm", "apple-silicon", "cli", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "huggingface-hub>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/weklund/mlx-stack"
Repository = "https://github.com/weklund/mlx-stack"
Issues = "https://github.com/weklund/mlx-stack/issues"
Documentation = "https://github.com/weklund/mlx-stack#readme"

[project.scripts]
mlx-stack = "mlx_stack.cli:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mlx_stack/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-x -q --tb=short -m 'not integration'"
markers = [
    "integration: real system integration tests (launchctl, etc.)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Darwin"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1",
    "ruff>=0.8",
]
